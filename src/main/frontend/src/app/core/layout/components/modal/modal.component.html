<div class="modal-container">
    <div class="modal-header">
        <h5 class="modal-title" id="modal-title">
            {{ title }}
        </h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="onCancel()"></button>
    </div>

    <div class="modal-body">

        @if(tipo === 'gravar'){
        <div>
            <label for="name" class="form-label">Introduza o código de autenticação</label>
            <input type="text" class="form-control" id="name" [(ngModel)]="pin">
        </div>
        }
        @if(tipo === 'outros'){
        <p>{{ message }}</p>
        }
    </div>

    <div class="modal-footer">
        @if (showCancelButton) {
        <button type="button" class="btn btn-danger" (click)="onCancel()">{{ buttonCancelLabel }}</button>
        }
        @if (showConfirmButton) {
        <button type="button" class="btn btn-success" (click)="onConfirm()">{{ buttonConfirmLabel }}</button>
        }
    </div>
</div>
