<div class="page-container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Detalhes do Utilizador</h1>
    <button class="btn btn-secondary" (click)="goBack()">
      <i class="fas fa-arrow-left"></i> Voltar
    </button>
  </div>

  <div *ngIf="loading" class="loading">Carregando detalhes do plano...</div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="user && !loading" class="card">
    <div class="card-body">
      <div class="col-md-6 mb-3">
        <label class="fw-bold">Nome Completo:</label>
        <p>{{user.fullName}}</p>
      </div>

      <div class="col-md-6 mb-3">
        <label class="fw-bold">Username:</label>
        <p>{{user.username}}</p>
      </div>

      <div class="col-md-6 mb-3">
        <label class="fw-bold">Data de Nascimento:</label>
        <p>{{user.birthdate | date:'yyyy/MM/dd'}}</p>
      </div>

      <div class="col-md-6 mb-3">
        <label class="fw-bold">Perfil:</label>
        <p>{{user.perfil}}</p>
      </div>

      <div class="col-md-6 mb-3">
        <label class="fw-bold">Plano:</label>
        <p>{{user.plano || 'Não atribuído'}}</p>
      </div>

      <div class="col-md-6 mb-3">
        <label class="fw-bold">Fisioterapeuta:</label>
        <p>{{user.fisioterapeuta || 'Não atribuído'}}</p>
      </div>
    </div>
  </div>
</div>
