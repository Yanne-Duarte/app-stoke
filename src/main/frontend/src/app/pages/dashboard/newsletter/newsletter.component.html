<div class="card mt-5">
    <div class="card-body">
        <h5 class="card-title">Informações</h5>

        <!-- Lista de Newsletters -->
        <div class="newsletter-list">
            <div *ngFor="let news of newsletters" class="m-4 newsletter-item">
                <div class="newsletter-header">
                    <div class="title">
                        <h4 class="mb-0">{{ news.title }}</h4>
                    </div>
                    <div class="author-date">
                        <span><i class="bi bi-person"></i> {{ news.authorName }}</span>
                        <span><i class="bi bi-calendar"></i> {{ news.createdAt | date:'yyyy/MM/dd' }}</span>
                    </div>

                </div>
                <div class="newsletter-content">
                    <div [innerHTML]="news.content"></div>
                </div>
                <hr class="mt-4">
            </div>
        </div>
    </div>
</div>
