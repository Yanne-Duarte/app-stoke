<!-- Botão flutuante quando chat fechado -->
<div class="chat-toggle-button" *ngIf="!isOpen" (click)="toggleChat()">
  <i class="fas fa-comments"></i>
</div>

<!-- Chat widget -->
<div class="chat-widget" *ngIf="isOpen" >
  <div class="chat-header d-flex justify-content-between" (click)="toggleChat()">
    <p *ngIf="currentUser?.perfil === 'TECHNICAL'">
      Conversando com {{ selectedPatient?.fullName }}
    </p>
    <p *ngIf="currentUser?.perfil !== 'TECHNICAL'">
      Conversando com seu fisioterapeuta
    </p>
    <i class="fas fa-close"></i>
  </div>

  <div class="chat-content" >
    <!-- Mensagem para pacientes sem fisioterapeuta -->
    <div class="no-chat" *ngIf="currentUser?.perfil !== 'TECHNICAL' && !currentUser?.fisioterapeuta">
      <p>Você não tem um fisioterapeuta associado.</p>
      <p>Entre em contato com o administrador.</p>
    </div>
    

    <div class=" " *ngIf="currentUser?.perfil === 'TECHNICAL' || currentUser?.fisioterapeuta">
      <!-- Seleção de pacientes para fisioterapeutas -->
      <div class="patient-selection" *ngIf="currentUser?.perfil === 'TECHNICAL'">
        <h3>Selecione um paciente</h3>
        <div class="patient-list">
          <div *ngFor="let patient of patients" class="patient-item"
            [class.selected]="selectedPatient?.id === patient.id" (click)="selectPatient(patient)">
            {{ patient.fullName }}
          </div>
        </div>
      </div>
      <!-- Chat ativo -->
      <ng-container *ngIf="currentUser?.perfil !== 'TECHNICAL' || selectedPatient">
       <!-- <div class="chat-info">
          <p *ngIf="currentUser?.perfil === 'TECHNICAL'">
            Conversando com {{ selectedPatient?.fullName }}
          </p>
          <p *ngIf="currentUser?.perfil !== 'TECHNICAL'">
            Conversando com seu fisioterapeuta
          </p>
        </div>-->

        <div class="messages" #messagesContainer>
          <div *ngFor="let message of messages" class="message"
            [ngClass]="{'message-sent': message.sender === currentUser?.username, 'message-received': message.sender !== currentUser?.username}">
            <div class="message-content">
              <div class="message-sender">{{message.sender}}</div>
              <div class="message-text">{{message.content}}</div>
              <div class="message-time">{{message.timestamp | date:'short'}}</div>
            </div>
          </div>
        </div>

        <form [formGroup]="form" (ngSubmit)="sendMessage()" class="message-form">
          <input type="text" formControlName="mensagem" placeholder="Digite sua mensagem..."
            (keyup.enter)="sendMessage()">
          <button type="submit" [disabled]="!form.value.mensagem?.trim()">
            <i class="fas fa-paper-plane"></i>
          </button>
        </form>
      </ng-container>
    </div>
  </div>
</div>
